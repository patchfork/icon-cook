name: Sync icons

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

concurrency:
  group: sync-icons
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fluent:
    name: Fluent UI System Icons
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Icon Cook
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out upstream assets
        uses: actions/checkout@v4
        with:
          repository: microsoft/fluentui-system-icons
          ref: main
          path: _upstream/fluent
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /assets/*/SVG/*.svg
            /assets/*/metadata.json
          sparse-checkout-cone-mode: false

      - name: Find relevant upstream changes
        id: upstream
        shell: bash
        run: |
          current=$(git -C _upstream/fluent rev-parse HEAD)
          current_tree=$(git -C _upstream/fluent rev-parse HEAD:assets)
          previous=$(test -f .upstream/fluent.commit && cat .upstream/fluent.commit || true)
          previous_tree=$(test -f .upstream/fluent.tree && cat .upstream/fluent.tree || true)

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "current_tree=$current_tree" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous_tree" && "$previous_tree" == "$current_tree" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous" ]]; then
            git -C _upstream/fluent fetch --depth=1 origin "$previous"
            git -C _upstream/fluent diff --name-only "$previous" "$current" -- assets > .changed-fluent.txt
            echo "incremental=true" >> "$GITHUB_OUTPUT"
          else
            echo "incremental=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        if: steps.upstream.outputs.changed == 'true'
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          python3 -m pip install --disable-pip-version-check boto3

      - name: Generate icons
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          args=()
          if [[ "${{ steps.upstream.outputs.incremental }}" == "true" ]]; then
            args+=(--changed-file .changed-fluent.txt)
          fi
          python3 scripts/sync_icons.py fluent \
            --source _upstream/fluent \
            --output icons/fli \
            --output-list .upload-fluent.txt \
            "${args[@]}"

      - name: Upload changed icons to S3-compatible buckets
        if: steps.upstream.outputs.changed == 'true'
        env:
          S3_CONFIGS: ${{ secrets.S3_CONFIGS }}
        run: |
          python3 scripts/upload_s3.py \
            --directory icons/fli \
            --file-list .upload-fluent.txt \
            --prefix img/icons/fli

      - name: Prepare merge artifact
        shell: bash
        env:
          CHANGED: ${{ steps.upstream.outputs.changed }}
          CURRENT: ${{ steps.upstream.outputs.current }}
          CURRENT_TREE: ${{ steps.upstream.outputs.current_tree }}
        run: |
          mkdir -p _artifact/state
          if [[ "$CHANGED" != "true" ]]; then
            echo false > _artifact/changed
            exit 0
          fi

          echo true > _artifact/changed
          printf '%s\n' "$CURRENT" > _artifact/state/fluent.commit
          printf '%s\n' "$CURRENT_TREE" > _artifact/state/fluent.tree
          mkdir -p _artifact/icons/fli
          while IFS= read -r name; do
            if [[ -n "$name" ]]; then
              cp "icons/fli/$name" "_artifact/icons/fli/$name"
            fi
          done < .upload-fluent.txt
          python3 scripts/build_index.py fli \
            --source _upstream/fluent \
            --index _artifact/index.json

      - name: Publish Fluent results
        uses: actions/upload-artifact@v4
        with:
          name: fluent-results
          path: _artifact
          retention-days: 1

  material:
    name: Material Symbols Rounded
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Icon Cook
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out upstream symbols
        uses: actions/checkout@v4
        with:
          repository: google/material-design-icons
          ref: master
          path: _upstream/material
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: /symbols/web/*/materialsymbolsrounded/*_24px.svg
          sparse-checkout-cone-mode: false

      - name: Find relevant upstream changes
        id: upstream
        shell: bash
        run: |
          current=$(git -C _upstream/material rev-parse HEAD)
          manifest=$(git -C _upstream/material ls-tree -r HEAD symbols/web \
            | awk '{ n = split($4, p, "/"); if (n == 5 && p[4] == "materialsymbolsrounded" && p[5] == p[3] "_24px.svg") print $3, $4 }' \
            | sha256sum | cut -d ' ' -f 1)
          previous=$(test -f .upstream/material-rounded.commit && cat .upstream/material-rounded.commit || true)
          previous_manifest=$(test -f .upstream/material-rounded.manifest && cat .upstream/material-rounded.manifest || true)

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous_manifest" && "$previous_manifest" == "$manifest" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous" ]]; then
            git -C _upstream/material fetch --depth=1 origin "$previous"
            git -C _upstream/material diff --name-only "$previous" "$current" -- symbols/web \
              | awk '{ n = split($0, p, "/"); if (n == 5 && p[4] == "materialsymbolsrounded" && p[5] == p[3] "_24px.svg") print }' > .changed-material.txt
            echo "incremental=true" >> "$GITHUB_OUTPUT"
          else
            echo "incremental=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        if: steps.upstream.outputs.changed == 'true'
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          python3 -m pip install --disable-pip-version-check boto3

      - name: Generate icons
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          args=()
          if [[ "${{ steps.upstream.outputs.incremental }}" == "true" ]]; then
            args+=(--changed-file .changed-material.txt)
          fi
          python3 scripts/sync_icons.py material-rounded \
            --source _upstream/material \
            --output icons/msr \
            --output-list .upload-material.txt \
            "${args[@]}"

      - name: Upload changed icons to S3-compatible buckets
        if: steps.upstream.outputs.changed == 'true'
        env:
          S3_CONFIGS: ${{ secrets.S3_CONFIGS }}
        run: |
          python3 scripts/upload_s3.py \
            --directory icons/msr \
            --file-list .upload-material.txt \
            --prefix img/icons/msr

      - name: Prepare merge artifact
        shell: bash
        env:
          CHANGED: ${{ steps.upstream.outputs.changed }}
          CURRENT: ${{ steps.upstream.outputs.current }}
          MANIFEST: ${{ steps.upstream.outputs.manifest }}
        run: |
          mkdir -p _artifact/state
          if [[ "$CHANGED" != "true" ]]; then
            echo false > _artifact/changed
            exit 0
          fi

          echo true > _artifact/changed
          printf '%s\n' "$CURRENT" > _artifact/state/material-rounded.commit
          printf '%s\n' "$MANIFEST" > _artifact/state/material-rounded.manifest
          mkdir -p _artifact/icons/msr
          while IFS= read -r name; do
            if [[ -n "$name" ]]; then
              cp "icons/msr/$name" "_artifact/icons/msr/$name"
            fi
          done < .upload-material.txt
          python3 scripts/build_index.py msr \
            --index _artifact/index.json

      - name: Publish Material results
        uses: actions/upload-artifact@v4
        with:
          name: material-results
          path: _artifact
          retention-days: 1

  commit:
    name: Merge and commit
    needs: [fluent, material]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Icon Cook
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Fluent results
        uses: actions/download-artifact@v4
        with:
          name: fluent-results
          path: _results/fluent

      - name: Download Material results
        uses: actions/download-artifact@v4
        with:
          name: material-results
          path: _results/material

      - name: Merge collection results
        shell: bash
        run: |
          for collection in fluent material; do
            result="_results/$collection"
            if [[ "$(cat "$result/changed")" != "true" ]]; then
              continue
            fi
            if [[ -d "$result/icons" ]]; then
              cp -R "$result/icons/." icons/
            fi
            cp "$result/state/"* .upstream/
          done
          python3 scripts/merge_indexes.py \
            --index index.json \
            _results/fluent/index.json \
            _results/material/index.json

      - name: Commit generated icons and upstream state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add icons/fli icons/msr index.json .upstream
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(icons): sync upstream collections"
          git pull --rebase
          git push
